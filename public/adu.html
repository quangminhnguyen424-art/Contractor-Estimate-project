<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB">
<title>Can I build an ADU?</title>
<meta name="description" content="Check what you can build on your lot: backyard cottage (DADU), ADU, and an estimated cost. Free, for King County homes.">
<style>
  /* The same look as the Studwise app and the signing page. */
  :root {
    --bg: #F5F7FB; --card: #FFFFFF; --ink: #0B1324; --ink2: #3B4659; --muted: #4F5A6B; --line: #DCE3EC;
    --accent: #2457F5; --accentDark: #1A3FC0; --tint: rgba(36,87,245,0.10);
    --okBg: #E6F6EF; --okInk: #08734F; --infoBg: #EEF3FF; --infoInk: #1A3FC0; --warnBg: #FFF4EC; --warnInk: #9A3412; --badBg: #FDECEC; --danger: #C2271B;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: 72px; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  button, input, textarea, select { font-family: inherit; }

  .bar { position: sticky; top: 0; z-index: 5; background: rgba(245,247,251,0.92); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .bar .in { max-width: 760px; margin: 0 auto; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex: none; overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { display: block; font-size: 12px; color: var(--muted); }
  .lang { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--accentDark); font-size: 13px; font-weight: 600; cursor: pointer; flex: none; }

  main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border-radius: 18px; border: 1px solid var(--line); padding: 18px; }
  .hero h1 { font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 6px; }
  .hero p { color: var(--ink2); font-size: 15px; line-height: 21px; margin: 0 0 14px; }
  .search { display: flex; gap: 10px; flex-wrap: wrap; }
  .search input { flex: 1 1 240px; }
  label.f { display: block; color: var(--ink2); font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=tel], input[type=email], input[type=number], textarea, select { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 17px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input[type=text], input[type=tel], input[type=email], input[type=number], select { height: 50px; padding: 0 14px; }
  textarea { min-height: 90px; padding: 12px 14px; resize: vertical; line-height: 1.4; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint); }
  .btn { height: 50px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 8px 20px rgba(36,87,245,0.25); transition: transform .08s, opacity .15s; text-decoration: none; }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .45; box-shadow: none; cursor: default; }
  .btn.full { width: 100%; height: 54px; font-size: 17px; border-radius: 16px; }
  .btn.secondary { background: var(--card); color: var(--accentDark); border: 1px solid var(--line); box-shadow: none; }
  .btn svg { width: 20px; height: 20px; }
  .note { color: var(--muted); font-size: 13px; line-height: 18px; margin-top: 10px; }
  .err { color: var(--danger); font-size: 14px; line-height: 19px; }
  .err:empty { display: none; }

  .pick { display: flex; flex-direction: column; gap: 8px; }
  .pick button { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 15px; cursor: pointer; }
  .pick button b { display: block; }
  .pick button span { color: var(--muted); font-size: 13px; }

  .verdict { border-radius: 18px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; }
  .verdict .ic { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; background: rgba(255,255,255,.7); }
  .verdict .ic svg { width: 24px; height: 24px; }
  .verdict h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.25; letter-spacing: -0.2px; }
  .verdict p { margin: 0 0 6px; font-size: 15px; line-height: 21px; }
  .v-yes { background: var(--okBg); color: var(--okInk); }
  .v-likely { background: var(--infoBg); color: var(--infoInk); }
  .v-check { background: var(--warnBg); color: var(--warnInk); }
  .v-no { background: var(--badBg); color: var(--danger); }
  .verdict p { color: var(--ink2); }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .fact { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .fact span { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
  .fact b { display: block; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .section { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 10px 2px -4px; }
  .sum { font-size: 16px; font-weight: 600; color: var(--ink); margin: 0 2px; line-height: 22px; }
  .sizes { display: flex; flex-direction: column; gap: 10px; }
  .size { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .size .sf { width: 64px; height: 64px; border-radius: 14px; background: var(--tint); color: var(--accentDark); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
  .size .sf b { font-size: 18px; line-height: 1; }
  .size .sf span { font-size: 11px; font-weight: 700; margin-top: 3px; }
  .size .t { flex: 1; min-width: 0; }
  .size .t b { display: block; font-size: 16px; }
  .size .t span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .size .price { flex: none; font-size: 16px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .size .price small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  ul.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  ul.list li { display: flex; gap: 10px; font-size: 15px; line-height: 21px; color: var(--ink2); }
  ul.list li::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  ul.list.warn li::before { background: #E08A3C; }
  ol.steps { margin: 0; padding: 0 0 0 4px; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
  ol.steps li { counter-increment: s; display: flex; gap: 12px; font-size: 15px; line-height: 21px; color: var(--ink2); }
  ol.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: none; }

  .locked { position: relative; overflow: hidden; }
  .locked .blur { filter: blur(5px); opacity: .55; pointer-events: none; user-select: none; }
  .gate { display: flex; flex-direction: column; gap: 12px; }
  .gate h3 { margin: 0; font-size: 20px; letter-spacing: -0.2px; }
  .gate p { margin: 0; color: var(--ink2); font-size: 15px; line-height: 21px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } .size { flex-wrap: wrap; } .size .price { width: 100%; text-align: left; padding-left: 78px; margin-top: -4px; } .size .price small { display: inline; margin-left: 6px; } }
  .ok { background: var(--okBg); color: var(--okInk); border-radius: 14px; padding: 14px; font-size: 15px; line-height: 21px; font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips a { flex: 1; min-width: 92px; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; background: var(--tint); color: var(--accentDark); font-weight: 600; font-size: 15px; text-decoration: none; }
  .chips svg { width: 18px; height: 18px; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--tint); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .fade { animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .fine { color: #6B7587; font-size: 12px; line-height: 17px; text-align: center; padding: 8px 4px 0; }
  .powered { text-align: center; color: #94A3B8; font-size: 12px; }
  .powered b { color: var(--muted); }
  @media print {
    .bar, .noprint, #gateCard, #searchCard { display: none !important; }
    body { background: #fff; }
    .card, .fact, .size { border-color: #ccc; }
  }
</style>
</head>
<body>
<header class="bar"><div class="in">
  <div class="logo" id="logo" aria-hidden="true"><svg viewBox="0 0 1024 1024" width="100%" height="100%" aria-hidden="true"><rect width="1024" height="1024" fill="#2457F5"/><g fill="#fff"><rect x="212" y="236" width="600" height="72" rx="22"/><rect x="212" y="716" width="600" height="72" rx="22"/><rect x="236" y="296" width="72" height="432" rx="14"/><rect x="716" y="296" width="72" height="432" rx="14"/></g><polyline points="372,524 472,620 650,384" fill="none" stroke="#FF8A3D" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="who"><b id="barCo">Studwise AI</b><span id="barSub"></span></div>
  <button class="lang" id="langBtn" type="button">Tiếng Việt</button>
</div></header>

<main>
  <section class="card hero" id="searchCard">
    <h1 id="heroTitle"></h1>
    <p id="heroText"></p>
    <form class="search" id="searchForm" autocomplete="on">
      <input id="addr" type="text" autocomplete="street-address" enterkeyhint="search" aria-labelledby="heroTitle">
      <button class="btn" id="go" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span id="goText"></span></button>
    </form>
    <div class="note" id="heroNote"></div>
    <div class="loading" id="loading" hidden style="margin-top:14px"><div class="spin"></div><span id="loadingText"></span></div>
    <div class="err" id="searchErr" role="alert" style="margin-top:10px"></div>
    <div class="pick" id="pick" hidden style="margin-top:12px"></div>

    <div id="manual" hidden style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
      <div class="note" id="manualText" style="margin:0"></div>
      <div class="two">
        <div><label class="f" for="mCity" id="mCityLabel"></label><input id="mCity" type="text" autocomplete="address-level2"></div>
        <div><label class="f" for="mLot" id="mLotLabel"></label><input id="mLot" type="number" inputmode="numeric" min="0"></div>
      </div>
      <button class="btn secondary" id="mGo" type="button"></button>
    </div>
  </section>

  <section id="result" hidden class="fade" style="display:flex;flex-direction:column;gap:14px">
    <div class="verdict" id="verdict"><div class="ic" id="vIcon"></div><div><h2 id="vTitle"></h2><div id="vText"></div></div></div>
    <div class="facts" id="facts"></div>
    <div class="section" id="buildTitle"></div>
    <div class="sum" id="buildSum"></div>
    <div class="sizes" id="sizes"></div>
    <div class="note" id="priceNote" style="margin-top:0"></div>

    <div class="card locked" id="lockedCard">
      <div class="blur" aria-hidden="true">
        <ul class="list"><li>••••••••••••••••••••••••••••••••••••</li><li>•••••••••••••••••••••••••••••</li><li>•••••••••••••••••••••••••••••••••••••••••</li><li>••••••••••••••••••••••</li></ul>
      </div>
    </div>

    <section class="card gate noprint" id="gateCard">
      <h3 id="gateTitle"></h3>
      <p id="gateText"></p>
      <div><label class="f" for="lName" id="lNameLabel"></label><input id="lName" type="text" autocomplete="name" maxlength="120"></div>
      <div class="two">
        <div><label class="f" for="lPhone" id="lPhoneLabel"></label><input id="lPhone" type="tel" autocomplete="tel" maxlength="40"></div>
        <div><label class="f" for="lEmail" id="lEmailLabel"></label><input id="lEmail" type="email" autocomplete="email" maxlength="120"></div>
      </div>
      <div><label class="f" for="lMsg" id="lMsgLabel"></label><textarea id="lMsg" maxlength="2000"></textarea></div>
      <button class="btn full" id="lSend" type="button"><span id="lSendText"></span></button>
      <div class="err" id="lErr" role="alert"></div>
      <div class="note" id="gateFine" style="margin:0"></div>
    </section>

    <section id="report" hidden class="fade" style="display:flex;flex-direction:column;gap:14px">
      <div class="ok" id="sentOk" hidden></div>
      <div class="card" id="rulesCard"><div class="section" id="rulesTitle" style="margin:0 0 12px"></div><ul class="list" id="rules"></ul></div>
      <div class="card"><div class="section" id="checksTitle" style="margin:0 0 12px"></div><ul class="list warn" id="checks"></ul></div>
      <div class="card"><div class="section" id="costTitle" style="margin:0 0 12px"></div><ul class="list" id="costs"></ul></div>
      <div class="card"><div class="section" id="stepsTitle" style="margin:0 0 12px"></div><ol class="steps" id="steps"></ol></div>
      <div class="chips noprint" id="contact"></div>
      <button class="btn secondary full noprint" id="print" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg><span id="printText"></span></button>
    </section>

    <button class="btn secondary full noprint" id="again" type="button"></button>
  </section>

  <div class="fine" id="fine"></div>
  <div class="powered" id="powered"></div>
  <div class="powered noprint"><a href="./privacy.html" style="color:inherit">Privacy</a> · <a href="./terms.html" style="color:inherit">Terms</a> · <a href="./support.html" style="color:inherit">Contact</a></div>
</main>

<script src="./cloud-config.js"></script>
<script src="./adu.js"></script>
</body>
</html>
