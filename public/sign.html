<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F7FB">
<title>Review and sign</title>
<style>
  /* The same colors and shapes as the Bidwell app (src/ui/theme.ts), so the client's page looks like the app. */
  :root {
    --bg: #F5F7FB; --card: #FFFFFF; --cardHi: #EEF2F8; --ink: #0B1324; --ink2: #3B4659; --muted: #4F5A6B; --line: #DCE3EC;
    --accent: #2457F5; --accentDark: #1A3FC0; --tint: rgba(36,87,245,0.10); --okBg: #E6F6EF; --okInk: #08734F;
    --warnBg: #FFF4EC; --warnInk: #9A3412; --danger: #C2271B;
    --paperInk: #1B1E22; --paperInk2: #3F444A; --paperMuted: #5B6168; --paperLine: #E2E0DA;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: 72px; scroll-padding-bottom: 120px; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }

  /* Header: like the app's top bar. */
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(245,247,251,0.92); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .bar .in { max-width: 728px; margin: 0 auto; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex: none; }
  .bar .who { flex: 1; min-width: 0; }
  .bar .who b { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .who span { display: block; font-size: 12px; color: var(--muted); }
  .lang { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--accentDark); font-size: 13px; font-weight: 600; cursor: pointer; flex: none; }

  main { flex: 1; width: 100%; max-width: 728px; margin: 0 auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border-radius: 18px; border: 1px solid var(--line); padding: 16px; }
  .paper { background: #fff; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 10px 28px rgba(15,23,42,.06); }
  .paper .co { color: var(--paperMuted); font-size: 13px; }
  .paper h1 { color: var(--paperInk); font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.3px; }
  .paper .job { color: var(--paperInk); font-size: 15px; font-weight: 600; }
  .paper .for { color: var(--paperMuted); font-size: 13px; }
  .paper .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--paperLine); padding-top: 10px; }
  .paper .total span { color: var(--paperInk2); font-size: 15px; }
  .paper .total b { color: var(--paperInk); font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
  .paper .body { color: var(--paperInk2); font-size: 13px; line-height: 19px; margin: 0; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips a { flex: 1; min-width: 92px; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; background: var(--tint); color: var(--accentDark); font-weight: 600; font-size: 15px; text-decoration: none; }
  .chips svg { width: 18px; height: 18px; }

  /* The full document, opened like a row in the app. */
  .row { width: 100%; display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; cursor: pointer; text-align: left; color: var(--ink); }
  .row .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
  .row .ic svg { width: 20px; height: 20px; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 16px; font-weight: 600; }
  .row .t span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row .chev { color: #94A3B8; transition: transform .2s; flex: none; }
  .row[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .docwrap { background: #fff; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
  iframe { display: block; width: 100%; height: 75vh; height: 75dvh; border: 0; background: #fff; }

  .section { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 8px 2px -4px; }
  .field label, .lbl { display: block; color: var(--ink2); font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input[type=text], textarea { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 17px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input[type=text] { height: 50px; padding: 0 14px; }
  textarea { min-height: 120px; padding: 12px 14px; resize: vertical; line-height: 1.4; }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint); }

  /* Signature pad: white paper with a line and "✕ Sign here", like the app's pad. */
  .pad { position: relative; height: 170px; border-radius: 14px; background: #fff; border: 1px solid var(--line); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad .base { position: absolute; left: 18px; right: 18px; bottom: 34px; height: 1.5px; background: #CBD5E1; pointer-events: none; }
  .pad .hint { position: absolute; left: 18px; bottom: 12px; color: #94A3B8; font-size: 12px; pointer-events: none; }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .clear { display: block; margin: 6px 0 0 auto; background: none; border: 0; color: #94A3B8; font-weight: 600; font-size: 14px; padding: 4px 2px; cursor: pointer; }

  .agree { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; }
  .agree input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; flex: none; margin: 0; border-radius: 7px; border: 2px solid #A8B3C4; background: #fff; display: grid; place-content: center; cursor: pointer; }
  .agree input:checked { background: var(--accent); border-color: var(--accent); }
  .agree input:checked::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .agree input:focus-visible { box-shadow: 0 0 0 3px var(--tint); }
  .agree .txt { font-size: 14px; line-height: 20px; color: var(--ink2); }
  .agree .en { display: block; margin-top: 6px; font-size: 12px; line-height: 17px; color: var(--muted); }

  .btn { width: 100%; height: 54px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 8px 20px rgba(36,87,245,0.28); transition: transform .08s, opacity .15s; }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .42; box-shadow: none; cursor: default; transform: none; }
  .btn svg { width: 20px; height: 20px; }
  .btn.secondary { background: var(--card); color: var(--accentDark); border: 1px solid var(--line); box-shadow: none; }
  .err { color: var(--danger); font-size: 14px; line-height: 19px; }
  .err:empty { display: none; }
  .ok { background: var(--okBg); color: var(--okInk); border-radius: 14px; padding: 14px; font-size: 15px; line-height: 21px; font-weight: 600; }

  /* Pinned at the bottom, like the app's footer button: always in view. */
  .foot { position: sticky; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .foot .in { max-width: 728px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .foot .need { text-align: center; font-size: 13px; color: var(--muted); min-height: 17px; }

  .center { text-align: center; padding: 32px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .center h1 { font-size: 22px; font-weight: 800; margin: 6px 0 0; letter-spacing: -0.3px; }
  .center p { color: var(--muted); font-size: 15px; line-height: 21px; margin: 0; max-width: 440px; }
  .tick { width: 84px; height: 84px; border-radius: 50%; background: var(--okBg); color: var(--okInk); display: flex; align-items: center; justify-content: center; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  .tick svg { width: 44px; height: 44px; }
  .sad { width: 72px; height: 72px; border-radius: 50%; background: var(--warnBg); color: var(--warnInk); display: flex; align-items: center; justify-content: center; }
  .sad svg { width: 36px; height: 36px; }
  .pay { margin-top: 12px; width: 100%; max-width: 360px; text-decoration: none; }
  @keyframes pop { from { transform: scale(.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .spin { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--tint); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .fade { animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .powered { text-align: center; color: #94A3B8; font-size: 12px; padding: 4px 0 8px; }
  .powered b { color: var(--muted); }
</style>
</head>
<body>
<header class="bar"><div class="in">
  <div class="logo" id="logo" aria-hidden="true">B</div>
  <div class="who"><b id="barCo">Bidwell AI</b><span id="barSub"></span></div>
  <button class="lang" id="langBtn" type="button" hidden></button>
</div></header>

<main id="app">
  <section class="center" id="loading"><div class="spin" aria-hidden="true"></div><p id="loadingText">Loading…</p></section>

  <section class="card center" id="gone" hidden>
    <div class="sad" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg></div>
    <h1 id="goneTitle"></h1>
    <p id="goneText"></p>
  </section>

  <section class="card center" id="done" hidden>
    <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 id="doneTitle"></h1>
    <p id="doneText"></p>
    <a class="btn pay" id="pay" href="#" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg><span id="payText"></span></a>
  </section>

  <section id="doc" hidden class="fade" style="display:flex;flex-direction:column;gap:14px">
    <div class="paper">
      <div class="co" id="company"></div>
      <h1 id="docTitle"></h1>
      <div class="job" id="title"></div>
      <div class="for" id="what"></div>
      <div class="total"><span id="totalLabel"></span><b id="total"></b></div>
      <p class="body" id="docBody"></p>
    </div>
    <div class="chips" id="contact" hidden></div>
    <button class="row" id="readBtn" type="button" aria-expanded="false" aria-controls="docwrap">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
      <span class="t"><b id="readTitle"></b><span id="readSub"></span></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="docwrap" id="docwrap" hidden><iframe id="frame" title="Document" sandbox=""></iframe></div>
  </section>

  <section id="signCard" hidden class="fade" style="display:flex;flex-direction:column;gap:14px">
    <div class="section" id="signSection"></div>
    <div class="field"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="80" enterkeyhint="done"></div>
    <div>
      <div class="lbl" id="padLabel"></div>
      <div class="pad" id="pad"><div class="base"></div><span class="hint" id="padHint"></span><canvas id="canvas" aria-label="Signature pad"></canvas></div>
      <button class="clear" id="clear" type="button" hidden></button>
    </div>
    <label class="agree"><input id="agree" type="checkbox"><span class="txt"><span id="agreeText"></span><span class="en" id="agreeEn" hidden></span></span></label>
    <div class="err" id="err" role="alert"></div>
  </section>

  <section id="askCard" hidden class="fade" style="display:flex;flex-direction:column;gap:12px">
    <div class="section" id="askLead"></div>
    <button class="btn secondary" id="askOpen" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span id="askOpenText"></span></button>
    <div id="askForm" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="askName" id="askNameLabel"></label><input id="askName" type="text" maxlength="80" autocomplete="name"></div>
      <div class="field"><label for="askText" id="askTextLabel"></label><textarea id="askText" maxlength="2000"></textarea></div>
      <button class="btn" id="askSend" type="button"><span id="askSendText"></span></button>
      <div class="err" id="askErr" role="alert"></div>
    </div>
    <div class="ok" id="askDone" hidden></div>
  </section>


  <div class="powered" id="powered"></div>
</main>

<footer class="foot" id="foot" hidden><div class="in">
  <button class="btn" id="submit" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span id="submitText"></span></button>
  <div class="need" id="need" aria-live="polite"></div>
</div></footer>

<script src="./cloud-config.js"></script>

    var when = r && r.signed_at ? new Date(r.signed_at).toLocaleDateString(LOCALE[lang] || 'en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
    return s.replace('{0}', co || 'your contractor').replace('{1}', r ? money(r.total) : '').replace('{2}', who).replace('{3}', when);
  }
  function set(id, k) { $(id).textContent = t(k); }

  function rpc(fn, body) {
    return fetch(cfg.url + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'content-type': 'application/json', apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey },
      body: JSON.stringify(body),
    }).then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); });
  }
  var PARTS = ['loading', 'gone', 'doc', 'signCard', 'askCard', 'done', 'foot'];
  function show(ids) { PARTS.forEach(function (x) { $(x).hidden = ids.indexOf(x) < 0; }); if (ids.indexOf('signCard') >= 0) requestAnimationFrame(size); }

  // Every word on the page, in the chosen language.
  function words() {
    document.documentElement.lang = lang;
    var change = r && r.kind === 'change';
    set('loadingText', 'loading'); set('goneText', 'goneText');
    if (!$('goneTitle').dataset.k) $('goneTitle').dataset.k = 'goneTitle';
    set('goneTitle', $('goneTitle').dataset.k);
    $('barSub').textContent = r ? t(change ? 'forC' : 'forQ') : '';
    set('docTitle', change ? 'change' : 'quote');
    set('what', change ? 'forC' : 'forQ');
    set('totalLabel', 'total'); set('docBody', change ? 'bodyC' : 'bodyQ');
    set('readTitle', change ? 'readC' : 'readQ');
    $('readSub').textContent = $('readBtn').getAttribute('aria-expanded') === 'true' ? t('hide') : t('readSub');
    set('signSection', 'signSection'); set('nameLabel', 'name'); set('padLabel', 'pad'); set('padHint', 'hint'); set('clear', 'clear');
    set('agreeText', 'agree');
    // The consent is kept in English too, under the client's language: English is the version on record.
    $('agreeEn').hidden = lang === 'en'; $('agreeEn').textContent = W.en.agree;
    $('submitText').textContent = sending ? t('sending') : t(change ? 'approve' : 'sign');
    set('askLead', 'askLead'); set('askOpenText', 'askOpen'); set('askNameLabel', 'name'); set('askTextLabel', 'askText'); set('askSendText', 'askSend'); set('askDone', 'askDone');
    set('doneTitle', 'doneTitle');
    $('doneText').textContent = r && r.status === 'signed' && r.signed_at && !justSigned ? t('signedOn') + ' · ' + t('doneText') : t('doneText');
    set('payText', 'pay');
    $('powered').innerHTML = ''; $('powered').append(t('powered') + ' '); var b = document.createElement('b'); b.textContent = 'Bidwell AI'; $('powered').append(b);
    contact();
    // One tap between the document's language and English.
    var other = lang === 'en' ? docLang : 'en';
    $('langBtn').hidden = docLang === 'en';
    $('langBtn').textContent = other === 'en' ? 'English' : W[other].english;
    check();
  }
  $('langBtn').onclick = function () { lang = lang === 'en' ? docLang : 'en'; words(); };

  function contact() {
    var c = $('contact'); c.innerHTML = '';
    if (!r) { c.hidden = true; return; }
    var tel = (r.company_phone || '').replace(/[^0-9+]/g, '');
    var icon = {
      call: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
      text: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
      email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    };
    function add(k, href) {
      var a = document.createElement('a'); a.href = href;
      a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + icon[k] + '</svg>';
      a.append(t(k)); c.appendChild(a);
    }
    if (tel) { add('call', 'tel:' + tel); add('text', 'sms:' + tel); }
    if (r.company_email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.company_email)) add('email', 'mailto:' + encodeURIComponent(r.company_email));
    c.hidden = !c.children.length;
  }

  // The full document opens below its row, like a row in the app.
  $('readBtn').onclick = function () {
    var open = $('readBtn').getAttribute('aria-expanded') !== 'true';
    $('readBtn').setAttribute('aria-expanded', String(open));
    $('docwrap').hidden = !open;
    $('readSub').textContent = open ? t('hide') : t('readSub');
    if (open) $('docwrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  // ── Signature pad. Strokes are kept as flat x,y lists in the pad's own size: the same shape the app stores and prints.
  var canvas = $('canvas'), ctx = canvas.getContext('2d'), strokes = [], cur = null, W0 = 0, H0 = 0;
  function size() {
    var rect = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    if (!rect.width) return;
    var w = Math.round(rect.width), h = Math.round(rect.height);
    // Ink already on the pad is scaled with it, so turning the phone does not lose or distort the signature.
    if (W0 && (w !== W0 || h !== H0) && strokes.length) {
      var sx = w / W0, sy = h / H0;
      strokes = strokes.map(function (s) { return s.map(function (v, i) { return Math.round(v * (i % 2 ? sy : sx) * 10) / 10; }); });
    }
    W0 = w; H0 = h;
    canvas.width = w * d; canvas.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw();
  }
  function line(s) {
    ctx.beginPath(); ctx.moveTo(s[0], s[1]);
    if (s.length === 4) { ctx.lineTo(s[2], s[3]); ctx.stroke(); return; }
    // Smooth: curve through the midpoints, as the app's PDF does.
    for (var i = 2; i < s.length - 2; i += 2) ctx.quadraticCurveTo(s[i], s[i + 1], (s[i] + s[i + 2]) / 2, (s[i + 1] + s[i + 3]) / 2);
    ctx.lineTo(s[s.length - 2], s[s.length - 1]); ctx.stroke();
  }
  function draw() {
    ctx.clearRect(0, 0, W0, H0); ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    strokes.forEach(line); if (cur) line(cur.length === 2 ? cur.concat([cur[0] + 0.5, cur[1] + 0.5]) : cur);
    $('clear').hidden = !strokes.length;
    $('padHint').style.opacity = strokes.length || cur ? '0.35' : '1';
    check();
  }
  function pt(e) {
    var rect = canvas.getBoundingClientRect();
    return [Math.round(Math.max(0, Math.min(W0, e.clientX - rect.left)) * 10) / 10, Math.round(Math.max(0, Math.min(H0, e.clientY - rect.top)) * 10) / 10];
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); canvas.setPointerCapture(e.pointerId); cur = pt(e); draw(); });
  canvas.addEventListener('pointermove', function (e) {
    if (!cur) return;
    var p = pt(e), n = cur.length;
    if (Math.hypot(p[0] - cur[n - 2], p[1] - cur[n - 1]) < 1.5) return;
    cur = cur.concat(p); draw();
  });
  function end() { if (cur) { strokes.push(cur.length === 2 ? cur.concat([cur[0] + 1, cur[1] + 1]) : cur); cur = null; draw(); } }
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  $('clear').onclick = function () { strokes = []; draw(); };
  window.addEventListener('resize', function () { if (!$('signCard').hidden) size(); });

  function ink() { return strokes.reduce(function (n, s) { return n + s.length / 2; }, 0); }
  function check() {
    var need = $('name').value.trim().length < 2 ? 'needName' : ink() < 12 ? 'needInk' : !$('agree').checked ? 'needAgree' : '';
    $('submit').disabled = sending || !!need;
    $('need').textContent = need ? t(need) : '';
  }
  $('name').oninput = check; $('agree').onchange = check;
  $('name').onkeydown = function (e) { if (e.key === 'Enter') e.target.blur(); };

  var justSigned = false;
  $('submit').onclick = function () {
    if ($('submit').disabled) return;
    sending = true; $('err').textContent = ''; words();
    rpc('submit_signature', { p_token: token, p_name: $('name').value.trim(), p_strokes: strokes, p_w: W0, p_h: H0, p_consent: $('agree').checked })
      .then(function (ok) {
        sending = false;
        if (ok) { justSigned = true; r.status = 'signed'; words(); show(['doc', 'done']); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        else { $('err').textContent = t('closed'); words(); }
      })
      .catch(function () { sending = false; $('err').textContent = t('failed'); words(); });
  };

  // Ask a question or request changes instead of signing.
  $('askOpen').onclick = function () {
    $('askOpen').hidden = true; $('askForm').hidden = false;
    $('askName').value = $('askName').value || $('name').value; $('askText').focus();
  };
  $('askSend').onclick = function () {
    var name = $('askName').value.trim(), text = $('askText').value.trim();
    if (name.length < 1 || text.length < 3) { $('askErr').textContent = t('askNeed'); return; }
    $('askSend').disabled = true; $('askErr').textContent = '';
    rpc('request_changes', { p_token: token, p_name: name, p_message: text })
      .then(function (ok) {
        if (ok) { $('askForm').hidden = true; $('askLead').hidden = true; $('askDone').hidden = false; }
        else { $('askErr').textContent = t('askClosed'); $('askSend').disabled = false; }
      })
      .catch(function () { $('askErr').textContent = t('failed'); $('askSend').disabled = false; });
  };

  function gone(k) { $('goneTitle').dataset.k = k; words(); show(['gone']); }

  words();
  if (!cfg.url || !token) { gone('goneTitle'); return; }
  rpc('get_sign_request', { p_token: token }).then(function (rows) {
    r = rows && rows[0];
    if (!r) { gone('goneTitle'); return; }
    // The page speaks the document's language: the contractor chose it for this client.
    var m = /<html[^>]*\blang="([^"]+)"/i.exec(r.html || '');
    docLang = pick(m && m[1]) || pick(navigator.language) || 'en'; lang = docLang;
    $('barCo').textContent = r.company || 'Bidwell AI';
    $('logo').textContent = (r.company || 'B').trim().charAt(0).toUpperCase() || 'B';
    document.title = (r.company ? r.company + ' · ' : '') + (r.title || 'Review and sign');
    $('company').textContent = r.company || ''; $('title').textContent = r.title || ''; $('total').textContent = money(r.total);
    $('name').value = r.client_name || '';
    $('frame').srcdoc = r.html || '';
    if (r.pay_link && /^https:\/\//.test(r.pay_link)) { $('pay').href = r.pay_link; $('pay').hidden = false; }
    words();
    if (r.status === 'signed') { show(['doc', 'done']); return; }
    if (r.expired) { gone('expiredTitle'); return; }
    show(['doc', 'signCard', 'askCard', 'foot']);
  }).catch(function () { gone('goneTitle'); });
})();
</script>
</body>
</html>
