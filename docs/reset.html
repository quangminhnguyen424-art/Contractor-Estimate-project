<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Choose a new password · Bidwell AI</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F5F7FB; --card: #FFFFFF; --ink: #0B1324; --ink2: #3B4659; --muted: #4F5A6B; --line: #DCE3EC; --accent: #2457F5; --ok: #08734F; --okbg: #E6F6EF; --bad: #C2271B; --badbg: #FDECEC; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Lexend', system-ui, sans-serif; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 48px 20px; display: flex; flex-direction: column; gap: 18px; }
  .logo { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); margin: 0 auto; display: grid; place-items: center; color: #fff; font-size: 30px; font-weight: 700; }
  h1 { text-align: center; font-size: 26px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  label { font-weight: 600; font-size: 14px; color: var(--ink2); }
  input { width: 100%; height: 52px; border-radius: 12px; border: 1px solid var(--line); padding: 0 14px; font: inherit; font-size: 17px; margin-top: 6px; }
  button { height: 54px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 600; }
  button:disabled { opacity: .5; }
  .msg { border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.4; }
  .ok { background: var(--okbg); color: var(--ok); } .bad { background: var(--badbg); color: var(--bad); }
  .muted { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.5; }
  .show { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">B</div>
  <h1>Choose a new password</h1>
  <div class="card" id="card">
    <div id="msg"></div>
    <form id="form">
      <label>New password (8 or more characters)<input id="p1" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <div style="height:12px"></div>
      <label>Type it again<input id="p2" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <div style="height:12px"></div>
      <label class="show"><input id="sh" type="checkbox" style="width:20px;height:20px;margin:0"> Show password</label>
      <div style="height:14px"></div>
      <button id="go" type="submit" style="width:100%">Save new password</button>
    </form>
  </div>
  <div class="muted">After saving, open the Bidwell AI app and log in with your new password.</div>
</div>
<script src="./cloud-config.js"></script>
<script>
(function () {
  var cfg = window.BIDWELL_CLOUD || {};
  var msg = document.getElementById('msg'), form = document.getElementById('form'), go = document.getElementById('go');
  function say(text, ok) { msg.className = 'msg ' + (ok ? 'ok' : 'bad'); msg.textContent = text; }
  var h = new URLSearchParams(location.hash.slice(1));
  var q = new URLSearchParams(location.search);
  var token = h.get('access_token');
  // Remove the one-time token from the address bar so it isn't kept in history.
  if (location.hash) history.replaceState(null, '', location.pathname);
  if (!token) {
    form.style.display = 'none';
    var expired = /expired|invalid/i.test((h.get('error_description') || q.get('error_description') || '') + (h.get('error_code') || ''));
    say(expired ? 'This link has expired or was already used. In the app, tap “Forgot password?” to get a new one.' : 'This page only works from the link in your password reset email.', false);
    return;
  }
  document.getElementById('sh').addEventListener('change', function (e) {
    document.getElementById('p1').type = document.getElementById('p2').type = e.target.checked ? 'text' : 'password';
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1.length < 8) return say('The password needs at least 8 characters.', false);
    if (p1 !== p2) return say('The two passwords don’t match.', false);
    go.disabled = true; go.textContent = 'Saving…';
    fetch(cfg.url + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'content-type': 'application/json', apikey: cfg.anonKey, Authorization: 'Bearer ' + token },
      body: JSON.stringify({ password: p1 })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error((r.j && (r.j.msg || r.j.message || r.j.error_description)) || 'Could not save the password.');
        form.style.display = 'none';
        say('Your password is saved. Open the Bidwell AI app and log in with it.', true);
      })
      .catch(function (err) {
        go.disabled = false; go.textContent = 'Save new password';
        say(/same|different/i.test(err.message) ? 'Choose a password different from your old one.' : err.message, false);
      });
  });
})();
</script>
</body>
</html>
